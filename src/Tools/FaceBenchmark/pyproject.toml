[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "frs-face-benchmark"
version = "1.1.0"
description = "Reproducible synthetic face verification benchmark"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
azure = ["azure-identity==1.25.1"]
generation = [
  "accelerate==1.10.0",
  "diffusers==0.35.1",
  "huggingface-hub==0.34.4",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "safetensors==0.6.2",
  "sentencepiece==0.2.1",
  "torch==2.7.1",
  "transformers==4.55.4"
]

[project.scripts]
face-benchmark = "face_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["face_benchmark"]
